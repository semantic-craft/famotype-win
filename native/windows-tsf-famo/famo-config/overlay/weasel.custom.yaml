# weasel.custom.yaml — 法墨 Windows (Famo) 品牌皮肤 + 候选窗外观
# 落 %LOCALAPPDATA%\Famo\。本文件 = 「即时桶」落点(皮肤/明暗/字体/排版/几何)，
# 设置面板改这些 → 前端轻量 reload 候选窗重绘，不走重部署。出处对照见 CONFIG-MAPPING.md §②③。
#
# 色值单一真相源 = shared/skins/colors.md。Windows 前端颜色为 BGR：6 位 0xBBGGRR=不透明，
# 8 位 0xAABBGGRR 才带透明度——纯色值与 macOS Squirrel 完全一致，只是键名不同。
# 当前默认皮肤 = 荔园红（shenda / shenda_dark，深大红品牌色），明暗跟随系统。
# 键名对照(Windows←Squirrel)：candidate_back_color←back_color；candidate_border_color←border_color；
#   hilited_label_color←hilited_candidate_label_color。

patch:
  style:
    color_scheme: shenda              # 即时桶：appearance.skin（亮）
    color_scheme_dark: shenda_dark    # 即时桶：appearance.appearanceMode（暗跟随）
    font_face: "微软雅黑"             # 即时桶：appearance.fontFace
    font_point: 19                    # 即时桶：appearance.fontPoint（对齐 Mac 1.3.3 中档）
    label_format: "%s."               # 即时桶：appearance.candidateFormat（标签格式；空=隐藏标签）
    label_font_point: 13.7            # 即时桶：主字号 × 0.72（0=隐藏标签）
    comment_font_point: 15.2          # 即时桶：主字号 × 0.8（0=隐藏注释）
    horizontal: true                  # 即时桶：appearance.orientation（true=横排）
    inline_preedit: false             # 即时桶：appearance.inlinePreedit
    show_preedit: true                # 候选窗输入串 + 可移动光标（独立于内嵌预编辑）
    preview_pages: false              # 横排候选条预览后页
    preview_rows: 2                   # 后页预览 1–2 行
    preedit_type: composition         # 即时桶：appearance.inlineCandidatePreview（composition=原样/preview=候选预览）
    layout:
      corner_radius: 13               # 即时桶：appearance.layout.cornerRadius
      border_width: 1                 # 即时桶：appearance.layout.borderWidth
      round_corner: 9                 # 选中高亮圆角（比面板小 4）
      hilite_padding_x: 8             # 高亮左右内边距
      hilite_padding_y: 7             # 高亮上下内边距
      hilite_spacing: 5               # 序号与候选词间距
      spacing: 6                      # 候选间距
      shadow_radius: 16               # 即时桶：appearance.layout.shadowRadius
      shadow_offset_x: 0
      shadow_offset_y: 7
      margin_x: 8                     # 即时桶：appearance.layout.margin
      margin_y: 8                     # 即时桶：appearance.layout.margin

