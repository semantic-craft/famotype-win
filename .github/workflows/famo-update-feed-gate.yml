name: Famo stable update feed gate

on:
  schedule:
    - cron: '17 3 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: famo-stable-update-feed
  cancel-in-progress: false

jobs:
  verify-stable-feed:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore the pinned WinSparkle verifier
        shell: pwsh
        run: >-
          dotnet restore
          native/windows-tsf-famo/settings-winui/FamoSettings/FamoSettings.csproj
          --nologo

      - name: Verify the real stable feed and installer signature
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          $verifier = './native/windows-tsf-famo/installer/verify-live-appcast.ps1'
          if ($env:EXPECTED_VERSION) {
            $verificationParameters = @{
              ExpectedVersion = $env:EXPECTED_VERSION
              RequiredInstallerArguments = '/SILENT /SP- /NOICONS'
            }
            & $verifier @verificationParameters
          } else {
            & $verifier
          }
